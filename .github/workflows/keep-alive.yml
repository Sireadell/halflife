name: Keep halflife warm

# Halflife runs on Render's free plan with no persistent disk, which is a
# deliberate tradeoff explained in render.yaml: a disk needs a paid plan, and
# the whole product is the memory, so losing it on every restart would defeat
# the point.
#
# The actual risk isn't the 15-minute idle sleep by itself, it's what a sleep
# causes: Render's free plan has no disk, so a restarted instance boots from a
# fresh image and the SQLite file that held every certification is gone. As
# long as the same instance keeps running without a restart, the file on its
# local disk survives, because nothing is deleting it, the process is just
# never asked to stop.
#
# So this ping is not decoration. It is the only thing standing between "the
# memory is real" and "the memory quietly resets every fifteen minutes,"
# which is the exact silent failure this project exists to catch in other
# agents. Same fix already proven working on telegraph-sentinel.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sw "\nHTTP:%{http_code} TIME:%{time_total}s\n" \
            --max-time 30 \
            "https://halflife-b0o4.onrender.com/health"
